name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,examples]'
      - run: python -m ruff check src tests scripts examples
      - run: python -m pytest
      - run: python scripts/validate_repo.py
      - run: python scripts/validate_uci_roman_urdu.py
      - run: python examples/plain_python.py
      - run: python examples/pandas_example.py
      - run: python examples/huggingface_example.py
