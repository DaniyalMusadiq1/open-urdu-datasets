name: Phase 2 pipeline checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  phase2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src/urdu_data/phase2.py scripts/phase2_ingest.py scripts/phase2_validate.py scripts/phase2_publish.py tests/test_phase2.py
      - run: python -m pytest tests/test_phase2.py
