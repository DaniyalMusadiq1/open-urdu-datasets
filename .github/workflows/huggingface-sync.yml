name: Publish pinned corpus releases to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Release operation
        type: choice
        required: true
        default: metadata
        options:
          - metadata
          - publish-cached
          - prepare-only
          - build-if-needed
permissions:
  contents: read
concurrency:
  group: huggingface-sync-main
  cancel-in-progress: false
jobs:
  prepare-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode != 'metadata'
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.release-artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Restore validated Klam release
        id: klam-cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/phase2-release/klam-original
          key: klam-release-v1-py312-${{ hashFiles('scripts/build_*release.py', 'scripts/import_*.py', 'scripts/validate_*.py', 'scripts/audit_new_corpus_duplicates.py', 'configs/sources.yaml', 'datasets/**', 'schemas/**', 'src/**', 'pyproject.toml') }}
      - name: Require a cached release for fast publishing
        if: inputs.mode == 'publish-cached' && steps.klam-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::No validated Klam release matches these inputs. Select build-if-needed to build it explicitly."
          exit 1
      - name: Install validation dependencies
        run: python -m pip install -e .
      - name: Install corpus build dependencies
        if: steps.klam-cache.outputs.cache-hit != 'true'
        run: python -m pip install -e '.[ingest]'
      - name: Restore pinned source release cache
        if: steps.klam-cache.outputs.cache-hit != 'true'
        id: phase2-cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/phase2-release
          key: klam-phase2-v2-py312-${{ hashFiles('scripts/build_phase2_release.py', 'scripts/import_*.py', 'scripts/validate_*.py', 'scripts/audit_new_corpus_duplicates.py', 'configs/sources.yaml', 'datasets/**', 'schemas/**', 'src/**', 'pyproject.toml') }}
      - name: Build pinned source releases and validate
        if: steps.klam-cache.outputs.cache-hit != 'true' && steps.phase2-cache.outputs.cache-hit != 'true'
        env:
          PHASE2_RELEASE_ROOT: artifacts/phase2-release
        run: python scripts/build_phase2_release.py
      - name: Save pinned source release cache
        if: steps.klam-cache.outputs.cache-hit != 'true' && steps.phase2-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: artifacts/phase2-release
          key: klam-phase2-v2-py312-${{ hashFiles('scripts/build_phase2_release.py', 'scripts/import_*.py', 'scripts/validate_*.py', 'scripts/audit_new_corpus_duplicates.py', 'configs/sources.yaml', 'datasets/**', 'schemas/**', 'src/**', 'pyproject.toml') }}
      - name: Build one normalized Klam dataset
        if: steps.klam-cache.outputs.cache-hit != 'true'
        env:
          PHASE2_RELEASE_ROOT: artifacts/phase2-release
        run: |
          python scripts/build_klam_release.py --output artifacts/phase2-release/klam-original --cleanup-phase2-inputs
      - name: Validate unified Klam release
        if: steps.klam-cache.outputs.cache-hit != 'true'
        run: python scripts/validate_klam_release.py artifacts/phase2-release/klam-original
      - name: Validate repository and prior hosted corpora
        env:
          PHASE2_RELEASE_ROOT: artifacts/phase2-release
        run: |
          python scripts/validate_repo.py
          python scripts/validate_klam_chat.py
          python scripts/validate_bulk.py
          python scripts/validate_web.py
          python scripts/validate_urwikisource_pd_old.py datasets/corpora/urwikisource-pd-old
      - name: Save validated Klam release before publishing
        if: steps.klam-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifacts/phase2-release/klam-original
          key: ${{ steps.klam-cache.outputs.cache-primary-key }}
      - name: Name the release artifact
        id: release-artifact
        run: echo "name=validated-klam-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Save the prepared release for publishing retries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release-artifact.outputs.name }}
          path: artifacts/phase2-release/klam-original
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-release:
    needs: prepare-release
    if: inputs.mode != 'prepare-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check Hugging Face secret
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: test -n "$HF_TOKEN" || { echo "::error::Set the HF_TOKEN repository secret."; exit 1; }
      - name: Install publishing dependencies
        run: python -m pip install -e . 'huggingface_hub>=0.26,<2'
      - name: Download the prepared release
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare-release.outputs.artifact-name }}
          path: artifacts/phase2-release/klam-original
      - name: Publish and verify corpus files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: Daniyal643/open-urdu-datasets
          GITHUB_SHA: ${{ github.sha }}
          PHASE2_RELEASE_ROOT: artifacts/phase2-release
        run: python scripts/sync_huggingface.py

  metadata-sync:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[hf-sync-metadata]')) ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'metadata'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install metadata sync dependencies
        run: python -m pip install -e '.[dev]' 'huggingface_hub>=0.26,<2'
      - name: Validate updated catalog
        run: |
          python scripts/validate_repo.py
          python scripts/validate_klam_chat.py
      - name: Sync metadata and Klam Chat
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: Daniyal643/open-urdu-datasets
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/sync_huggingface.py --metadata-only

